# Publishes the public snapshot to PyPI with trusted publishing (OIDC).
# This file has no PyPI token. PyPI must have a trusted publisher for
# Halmoslabs/adoor-py, workflow publish.yml, environment pypi. Create that
# environment, with a required reviewer, before the first v* tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Refuse a tag that does not match the package version
        run: python scripts/check-pypi-publish.py "$GITHUB_REF_NAME"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build
      - name: Install the wheel into a clean environment and import adoor
        run: |
          python -m venv "${RUNNER_TEMP}/adoor-install"
          py="${RUNNER_TEMP}/adoor-install/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-index --no-deps dist/*.whl
          "$py" - <<'PY'
          import adoor, os, sys
          from importlib.metadata import metadata
          path = os.path.realpath(adoor.__file__)
          prefix = os.path.realpath(sys.prefix)
          assert path.startswith(prefix + os.sep), (path, prefix)
          assert callable(adoor.login)
          meta = metadata("adoor")
          assert meta["Name"] == "adoor", meta["Name"]
          assert meta["Version"] == adoor.__version__, meta["Version"]
          assert meta["Requires-Python"] == ">=3.9", meta["Requires-Python"]
          print("adoor", adoor.__version__, "on Python", sys.version.split()[0])
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
