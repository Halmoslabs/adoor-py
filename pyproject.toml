[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adoor"
version = "0.1.2"
description = "ADoor for Python: shared PostgreSQL tables for notebooks, pipelines and eval sandboxes, with per-identity access, history and undo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Halmos Labs" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["adoor", "postgresql", "electronic lab notebook", "provenance", "experiment tracking", "evals", "jupyter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://adoor.run/science/"
Documentation = "https://adoor.run/docs/guides/python/"
Source = "https://github.com/Halmoslabs/adoor-py"
Issues = "https://github.com/Halmoslabs/adoor-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adoor"]

[tool.hatch.build.targets.sdist]
include = ["src/adoor", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
